<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Editor de encuadre</title>
<style>
  :root{ --bg:#F3F0E9; --ink:#14130F; --red:#D6401C; --slate:#4B4E52; --line:#DDD7C9; --card:#FFFFFF; --ok:#1E7A46; }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,sans-serif;padding-bottom:100px;}
  header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);padding:16px 28px;display:flex;justify-content:space-between;align-items:center;z-index:10;gap:16px;flex-wrap:wrap;}
  header h1{font-size:17px;margin:0;}
  header p{margin:2px 0 0;font-size:12.5px;color:var(--slate);}
  #status{font-size:12.5px;color:var(--slate);font-family:"Consolas",monospace;}
  #status.dirty{color:var(--red);}
  #status.saved{color:var(--ok);}
  .btn{font:inherit;font-weight:600;background:var(--ink);color:var(--bg);border:none;padding:10px 20px;border-radius:4px;cursor:pointer;}
  .btn:disabled{opacity:.4;cursor:default;}
  .btn:hover:not(:disabled){background:var(--red);}
  main{max-width:1400px;margin:0 auto;padding:24px 28px;}
  .page-group{margin-bottom:36px;}
  .page-group h2{font-size:14px;text-transform:uppercase;letter-spacing:.06em;color:var(--slate);border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:16px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:22px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:6px;overflow:hidden;}
  .frame{position:relative;aspect-ratio:4/3;overflow:hidden;background:var(--line);cursor:ns-resize;user-select:none;}
  .frame.wide{aspect-ratio:21/9;}
  .frame img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;}
  .frame .hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0);opacity:0;transition:opacity .15s;color:#fff;font-size:12px;font-family:monospace;text-shadow:0 1px 3px rgba(0,0,0,.6);}
  .frame:hover .hint{opacity:1;background:rgba(0,0,0,.08);}
  .card-body{padding:12px 14px 14px;}
  .card-body .name{font-size:12.5px;font-weight:600;margin-bottom:8px;word-break:break-all;color:var(--slate);}
  .slider-row{display:flex;align-items:center;gap:10px;}
  .slider-row input[type=range]{flex:1;accent-color:var(--red);}
  .slider-row .val{font-family:monospace;font-size:12px;width:34px;text-align:right;color:var(--ink);}
  .reset{font-size:11px;color:var(--slate);background:none;border:none;cursor:pointer;text-decoration:underline;padding:0;margin-top:6px;}
  .reset:hover{color:var(--red);}
  .changed .frame{outline:2px solid var(--red);outline-offset:-2px;}
  #panel{position:fixed;left:0;right:0;bottom:0;background:var(--ink);color:var(--bg);padding:16px 28px;display:none;z-index:20;box-shadow:0 -4px 16px rgba(0,0,0,.25);}
  #panel.open{display:block;}
  #panel h3{margin:0 0 8px;font-size:13px;}
  #panel textarea{width:100%;height:110px;font-family:Consolas,monospace;font-size:11.5px;background:#0000;color:var(--bg);border:1px solid #444;border-radius:4px;padding:10px;resize:vertical;}
  #panel .actions{display:flex;gap:10px;margin-top:10px;align-items:center;flex-wrap:wrap;}
  #panel .close{background:none;border:1px solid #666;color:var(--bg);border-radius:4px;padding:8px 14px;cursor:pointer;font:inherit;}
  #copyMsg{font-size:12px;color:#8FD6A8;}
</style>
</head>
<body>

<header>
  <div>
    <h1>Editor de encuadre — Pablo Islas Portfolio</h1>
    <p>Arrastra verticalmente sobre cada foto (o usa el control) para ajustar qué parte se ve dentro del recorte. Solo se mueve la posición vertical. No necesita servidor: se abre directo con doble clic.</p>
  </div>
  <div style="display:flex;align-items:center;gap:14px;">
    <span id="status">sin cambios sin guardar</span>
    <button id="save" class="btn" disabled>Obtener valores</button>
  </div>
</header>

<main>
  <div id="content"></div>
</main>

<div id="panel">
  <h3>Valores actuales (crops.json)</h3>
  <textarea id="jsonOut" readonly></textarea>
  <div class="actions">
    <button id="download" class="btn">Descargar crops.json</button>
    <button id="copy" class="btn">Copiar al portapapeles</button>
    <span id="copyMsg"></span>
    <button id="closePanel" class="close">Cerrar</button>
  </div>
</div>

<script>
// Imagen -> grupo (página) al que pertenece, en el orden actual del book.
// wide:true = la imagen se muestra en un recuadro ancho (21:9) en esa página.
var GROUPS = [
  { label: 'Home — grid de trabajo', items: [
    { key: 'imas/cursos_verano/portada.png', wide: false },
    { key: 'imas/cabrona/cabrona_aretes.png', wide: false },
    { key: 'imas/pomodorer/state_1.png', wide: false },
    { key: 'behance_download/Music-video-for-Katfish/1.png', wide: false },
    { key: 'imas/OvvO/ovvo_gifs/1.gif', wide: false },
    { key: 'imas/ai/03e88a80-5f01-45f0-8561-28563e2cbfe1.png', wide: false },
    { key: 'behance_download/Generative-Forecasts/145e7d235249179.68d38124d322c.jpg', wide: false },
    { key: 'imas/golcam/golcam_golconfirmado_desktop.png', wide: false },
    { key: 'behance_download/Bike-Punks-flyers/1.png', wide: false }
  ]},
  { label: 'SJRT Broadcast Network', items: [
    { key: 'imas/postales/postal_leonora.png', wide: false },
    { key: 'imas/postales/postal_taco.png', wide: false },
    { key: 'imas/postales/postal_artesano.png', wide: false },
    { key: 'imas/postales/postal_bailarines_2.png', wide: false },
    { key: 'imas/postales/postal_bosques.png', wide: false },
    { key: 'imas/postales/postal_zuno.png', wide: false },
    { key: 'imas/cursos_verano/portada.png', wide: true },
    { key: 'imas/cursos_verano/cursosVerano_vertical_1.png', wide: false },
    { key: 'imas/cursos_verano/cursosVerano_vertical_2.png', wide: false }
  ]},
  { label: 'Cabrona', items: [
    { key: 'imas/cabrona/cabrona_aretes.png', wide: false },
    { key: 'imas/cabrona/cabrona_aretes_2.png', wide: false }
  ]},
  { label: 'Pomodoro', items: [
    { key: 'imas/pomodorer/state_1.png', wide: false },
    { key: 'imas/pomodorer/1_timer.png', wide: false },
    { key: 'imas/pomodorer/2_timers.png', wide: false },
    { key: 'imas/pomodorer/vertical_mode.png', wide: false }
  ]},
  { label: 'Katfish — Music Video', items: [
    { key: 'behance_download/Music-video-for-Katfish/1.png', wide: false },
    { key: 'behance_download/Music-video-for-Katfish/2.png', wide: false },
    { key: 'behance_download/Music-video-for-Katfish/3.png', wide: false },
    { key: 'behance_download/Music-video-for-Katfish/4.png', wide: true }
  ]},
  { label: 'OvvO', items: [
    { key: 'imas/OvvO/ovvo_gifs/1.gif', wide: false },
    { key: 'imas/OvvO/ovvo_gifs/2.gif', wide: false },
    { key: 'imas/OvvO/ovvo_gifs/2_1.gif', wide: false },
    { key: 'imas/OvvO/ovvo_gifs/3.gif', wide: false },
    { key: 'imas/OvvO/ovvo_gifs/5.gif', wide: false },
    { key: 'imas/OvvO/ovvo_gifs/6.gif', wide: false }
  ]},
  { label: 'AI & Generative', items: [
    { key: 'imas/ai/03e88a80-5f01-45f0-8561-28563e2cbfe1.png', wide: false },
    { key: 'imas/ai/0_asdf1.jpg', wide: false },
    { key: 'imas/ai/ai_ovvos/1%202.png', wide: false }
  ]},
  { label: 'Weather Postcards', items: [
    { key: 'behance_download/Generative-Forecasts/145e7d235249179.68d38124d322c.jpg', wide: false },
    { key: 'behance_download/Generative-Forecasts/2f23bb235249179.68d38124d37b3.jpg', wide: false },
    { key: 'behance_download/Generative-Forecasts/59b0ca235249179.68d38124d3ece.png', wide: false },
    { key: 'behance_download/Generative-Forecasts/d3a781235249179.68d381240c04c.png', wide: false },
    { key: 'behance_download/Generative-Forecasts/de2c2d235249179.68d381240c8a4.png', wide: true },
    { key: 'imas/postales/postal_dormir.png', wide: false },
    { key: 'imas/postales/postal_ventanaUniverso.png', wide: false }
  ]},
  { label: 'Bike Punk Flyers', items: [
    { key: 'behance_download/Bike-Punks-flyers/1.png', wide: false },
    { key: 'behance_download/Bike-Punks-flyers/2.png', wide: false },
    { key: 'behance_download/Bike-Punks-flyers/3.png', wide: false },
    { key: 'behance_download/Bike-Punks-flyers/4.png', wide: false },
    { key: 'behance_download/Bike-Punks-flyers/5.png', wide: true }
  ]}
];

// Valores guardados actualmente en imas/crops.json (punto de partida).
var crops = {"imas/cursos_verano/portada.png":52,"behance_download/Music-video-for-Katfish/1.png":13,"imas/cabrona/cabrona_aretes.png":47,"imas/ai/03e88a80-5f01-45f0-8561-28563e2cbfe1.png":5,"behance_download/Bike-Punks-flyers/1.png":16,"behance_download/Generative-Forecasts/145e7d235249179.68d38124d322c.jpg":100,"behance_download/Generative-Forecasts/2f23bb235249179.68d38124d37b3.jpg":100,"behance_download/Generative-Forecasts/59b0ca235249179.68d38124d3ece.png":100,"behance_download/Generative-Forecasts/d3a781235249179.68d381240c04c.png":100,"behance_download/Generative-Forecasts/de2c2d235249179.68d381240c8a4.png":88,"imas/postales/postal_dormir.png":18,"imas/postales/postal_ventanaUniverso.png":23,"imas/postales/postal_leonora.png":12,"imas/postales/postal_taco.png":6,"imas/postales/postal_artesano.png":100,"imas/postales/postal_bailarines_2.png":13,"imas/postales/postal_bosques.png":100,"imas/postales/postal_zuno.png":15,"imas/cursos_verano/cursosVerano_vertical_1.png":96,"imas/cursos_verano/cursosVerano_vertical_2.png":94,"imas/cabrona/cabrona_aretes_2.png":91,"behance_download/Music-video-for-Katfish/2.png":33,"behance_download/Music-video-for-Katfish/3.png":35,"behance_download/Music-video-for-Katfish/4.png":30,"imas/ai/0_asdf1.jpg":39,"imas/ai/ai_ovvos/1%202.png":17,"behance_download/Bike-Punks-flyers/2.png":16,"behance_download/Bike-Punks-flyers/3.png":16,"behance_download/Bike-Punks-flyers/4.png":17,"behance_download/Bike-Punks-flyers/5.png":12};

var initial = {};       // key -> value when the page loaded (to detect changes)
var dirty = {};         // key -> true if changed since load
var els = {};           // key -> [{ img, range, val, card }]

function setStatus() {
  var n = Object.keys(dirty).length;
  var status = document.getElementById('status');
  var save = document.getElementById('save');
  if (n === 0) {
    status.textContent = 'sin cambios sin guardar';
    status.className = '';
    save.disabled = true;
  } else {
    status.textContent = n + ' foto(s) modificadas';
    status.className = 'dirty';
    save.disabled = false;
  }
}

function applyValue(key, val) {
  crops[key] = val;
  (els[key] || []).forEach(function (e) {
    e.img.style.objectPosition = '50% ' + val + '%';
    e.range.value = val;
    e.val.textContent = val + '%';
    e.card.classList.toggle('changed', val != initial[key]);
  });
}

function registerImage(grid, key, wide) {
  var current = crops[key] !== undefined ? crops[key] : 50;
  if (initial[key] === undefined) initial[key] = current;

  var card = document.createElement('div');
  card.className = 'card';

  var frame = document.createElement('div');
  frame.className = 'frame' + (wide ? ' wide' : '');
  var im = document.createElement('img');
  im.src = '../' + key;
  im.style.objectPosition = '50% ' + current + '%';
  var hint = document.createElement('div');
  hint.className = 'hint';
  hint.textContent = 'arrastra ↕';
  frame.appendChild(im);
  frame.appendChild(hint);

  var body = document.createElement('div');
  body.className = 'card-body';
  var name = document.createElement('div');
  name.className = 'name';
  name.textContent = key.split('/').pop();
  var row = document.createElement('div');
  row.className = 'slider-row';
  var range = document.createElement('input');
  range.type = 'range'; range.min = 0; range.max = 100; range.value = current;
  var val = document.createElement('span');
  val.className = 'val';
  val.textContent = current + '%';
  row.appendChild(range); row.appendChild(val);
  var reset = document.createElement('button');
  reset.className = 'reset';
  reset.textContent = 'restablecer centro (50%)';

  body.appendChild(name); body.appendChild(row); body.appendChild(reset);
  card.appendChild(frame); card.appendChild(body);
  grid.appendChild(card);

  if (!els[key]) els[key] = [];
  els[key].push({ img: im, range: range, val: val, card: card });

  function onChange(v) {
    v = Math.max(0, Math.min(100, Math.round(v)));
    applyValue(key, v);
    if (v === initial[key]) { delete dirty[key]; } else { dirty[key] = true; }
    setStatus();
  }

  range.addEventListener('input', function () { onChange(+range.value); });
  reset.addEventListener('click', function () { onChange(50); });

  var dragging = false, startY = 0, startVal = current;
  frame.addEventListener('mousedown', function (e) {
    dragging = true; startY = e.clientY; startVal = +range.value;
    e.preventDefault();
  });
  window.addEventListener('mousemove', function (e) {
    if (!dragging) return;
    var rect = frame.getBoundingClientRect();
    var deltaPct = ((e.clientY - startY) / rect.height) * 100;
    onChange(startVal + deltaPct);
  });
  window.addEventListener('mouseup', function () { dragging = false; });
}

var content = document.getElementById('content');
GROUPS.forEach(function (g) {
  var group = document.createElement('div');
  group.className = 'page-group';
  group.innerHTML = '<h2>' + g.label + '</h2><div class="grid"></div>';
  var grid = group.querySelector('.grid');
  g.items.forEach(function (it) { registerImage(grid, it.key, it.wide); });
  content.appendChild(group);
});
setStatus();

function showPanel() {
  var out = {};
  Object.keys(crops).sort().forEach(function (k) { out[k] = crops[k]; });
  document.getElementById('jsonOut').value = JSON.stringify(out);
  document.getElementById('panel').classList.add('open');
  document.getElementById('copyMsg').textContent = '';
}

document.getElementById('save').addEventListener('click', showPanel);
document.getElementById('closePanel').addEventListener('click', function () {
  document.getElementById('panel').classList.remove('open');
});

document.getElementById('download').addEventListener('click', function () {
  var blob = new Blob([document.getElementById('jsonOut').value], { type: 'application/json' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'crops.json';
  a.click();
});

document.getElementById('copy').addEventListener('click', function () {
  var ta = document.getElementById('jsonOut');
  ta.select();
  var msg = document.getElementById('copyMsg');
  navigator.clipboard.writeText(ta.value).then(function () {
    msg.textContent = 'copiado ✓';
  }).catch(function () {
    document.execCommand('copy');
    msg.textContent = 'copiado ✓ (respaldo)';
  });
});
</script>
</body>
</html>
